<!doctype html>
<html lang="{{htmlLang}}" data-page="{{page}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--head-->
<meta name="theme-color" content="#F2F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060B1F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!--if:!lang_ru--><link rel="preload" href="/fonts/2027/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/2027/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><!--/if:!lang_ru-->
<!--if:lang_ru--><link rel="preload" href="/fonts/2027/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/2027/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin><!--/if:lang_ru-->
<link rel="stylesheet" href="/css/ku.css">
<script>
/* Ko'rinish sozlamalari — sahifa chizilishidan oldin (miltillashsiz) */
(function(d){var r=d.documentElement;r.classList.remove('no-js');r.classList.add('js');try{var s=localStorage,t=s.getItem('ku-theme');if(t==='light'||t==='dark')r.setAttribute('data-theme',t);if(s.getItem('ku-contrast')==='high')r.setAttribute('data-contrast','high');if(s.getItem('ku-motion')==='calm')r.classList.add('calm');var f=parseFloat(s.getItem('ku-fs'));if(f>=.85&&f<=1.4)r.style.setProperty('--fs',f);}catch(e){}})(document);
</script>
<script type="module" src="/js/ku.js"></script>
</head>
