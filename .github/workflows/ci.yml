name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Testlar (node --test)
        run: node --test
